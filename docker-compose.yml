services:
  sonarrepopulse:
    build: .
    container_name: sonarrepopulse
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./sonar_key_mappings.yaml:/app/sonar_key_mappings.yaml:ro
      - ./reports:/app/reports
    restart: unless-stopped
